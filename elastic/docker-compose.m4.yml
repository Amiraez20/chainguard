# Elasticsearch + Kibana pour tester le module M4 seule, en attendant le docker-compose commun d'Amira.
#   Linux/WSL2 :  sudo sysctl -w vm.max_map_count=262144
#   docker compose -f elastic/docker-compose.m4.yml up -d
#   Elasticsearch : http://localhost:9200   Kibana : http://localhost:5601 (1 à 2 min au premier démarrage)
# Sécurité désactivée : usage local de démo uniquement, ne jamais exposer ces ports.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: cg-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: cg-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # clé obligatoire pour les règles d'alerte (32 caractères minimum) ; démo locale seulement
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=chainguard-demo-key-0123456789abcdef
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata:
